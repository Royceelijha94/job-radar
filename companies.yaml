# job-radar config
# ats: greenhouse | lever | ashby | smartrecruiters | workday | oracle_hcm | amazon | uber | manual
# "manual" = no public job feed; set a job alert on their careers site instead.
# verify: true = board name is my best guess; `python radar.py validate` will confirm or flag it.

filters:
  title_include:
    - 'site reliability'
    - '\bsre\b'
    - 'devops'
    - 'dev ops'
    - 'platform engineer'
    - 'cloud engineer'
    - 'cloud operations'
    - 'cloud infrastructure'
    - 'infrastructure engineer'
    - 'production engineer'
    - 'reliability engineer'
    - 'observability'
    - 'kubernetes'
  title_exclude:
    - 'manager'
    - 'director'
    - 'principal'
    - '\bstaff\b'
    - 'intern'
    - 'head of'
    - '\bvp\b'
    - 'sales'
    - 'java'
    - 'database'
  location_include:
    - 'bengaluru'
    - 'bangalore'
    - 'india'
    - 'dubai'
    - 'united arab emirates'
    - 'uae'
  # Workday often says "3 Locations" instead of names. true = alert anyway so you don't miss it.
  allow_unknown_location: true

alerts:
  max_items_per_alert: 10      # longer lists are summarised
  # Alert channels are set as GitHub Secrets (never commit tokens here):
  #   NTFY_TOPIC, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

companies:
  # ---- Tier 1: big tech, best SRE practice (stretch / long game) ----
