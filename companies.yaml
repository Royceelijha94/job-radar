# job-radar config
# ats: greenhouse | lever | ashby | smartrecruiters | workday | oracle_hcm | amazon | uber | manual | auto
# "auto" = job-radar finds the board itself: it tries each slug on Greenhouse, Ashby, Lever and
#   SmartRecruiters (plus the workday candidate if given), remembers what works, and retries
#   companies it couldn't find every 3 days. Not found = listed under "Check these yourself".
# "manual" = no public job feed; set a job alert on their careers site instead.
# verify: true = board name is my best guess; `python radar.py validate` will confirm or flag it.

filters:
  title_include:
    - 'site reliability'
    - '\bsre\b'
    - 'devops'
    - 'dev ops'
    - 'platform engineer'
    - 'cloud engineer'
    - 'cloud operations'
    - 'cloud infrastructure'
    - 'infrastructure engineer'
    - 'production engineer'
    - 'reliability engineer'
    - 'observability'
    - 'kubernetes'
  title_exclude:
    - 'manager'
    - 'director'
    - 'principal'
    - '\bstaff\b'
    - 'intern'
    - 'head of'
    - '\bvp\b'
    - 'sales'
    - 'java'
    - 'database'
  location_include:
    - 'bengaluru'
    - 'bangalore'
    - 'india'
    - 'dubai'
    - 'united arab emirates'
    - 'uae'
    - 'abu dhabi'
    # Indian cities/states, for listings that don't say "India" (common on LinkedIn)
    - 'karnataka'
    - 'hyderabad'
    - 'telangana'
    - 'pune'
    - 'mumbai'
    - 'maharashtra'
    - 'chennai'
    - 'tamil nadu'
    - 'delhi'
    - 'gurugram'
    - 'gurgaon'
    - 'haryana'
    - 'noida'
    - 'kochi'
    - 'ahmedabad'
  # Workday often says "3 Locations" instead of names. true = alert anyway so you don't miss it.
  allow_unknown_location: true

alerts:
  max_items_per_alert: 10      # longer lists are summarised
  # Alert channels are set as GitHub Secrets (never commit tokens here):
  #   NTFY_TOPIC, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

